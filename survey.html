<!DOCTYPE html>
<html>

<head>
    <title>E-Learning Survey</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="navbar">
            <h2>E-Learning CEP 📚</h2>

            <nav>
                <a href="index.html">Home</a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfwmdserxDOrWrwDbehs0ByWV3xXHVJH_MXJp77dh9YNoAktg/viewform?usp=header">Survey</a>
                <a href="resources.html">Resources</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <section class="survey-container">

        <p class="tagline">E-LEARNING SURVEY</p>

        <h1>Tell Us About Your E-Learning Experience</h1>

        <p>
            Your responses will help us understand the digital learning
            needs and challenges in government schools.
        </p>

        <form id="surveyForm" action="https://e-learning-cep.onrender.com/submit-survey" method="POST">

            <label>1.Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>2.Age</label>
            <input type="number" placeholder="Enter your age" required>

            <label>3.Occupation</label>
            <select name="occupation" required>
                <option>Select occupation</option>
                <option>Student</option>
                <option>Teacher</option>
                <option>Employee</option>
                <option>others</option>
            </select>

            <label>4.Does your school have computers or laptops?</label>

            <select name="school_computers" required>
             <option>Select an option</option>
             <option>Yes</option>
             <option>No</option>
             <option>Not sure</option>
            </select>

            <label>5.Does your school have internet access?</label>

            <select name="internet_access" required>
              <option>Select an option</option>
              <option>Yes</option>
              <option>No</option>
              <option>Limited access</option>
            </select>

            <label>6.Do you have a smartphone or tablet at home?</label>

            <select name="home_devices" required>
             <option>Select an option</option>
             <option>Yes</option>
             <option>No</option>
             <option>Shared with family</option>
           </select>

           <label>7.Are you familiar with e-learning platforms?</label>

           <select name="e_learning" required>
             <option>Select an option</option>
             <option>Yes</option>
             <option>No</option>
             <option>Somewhat</option>
           </select>

           <label>8.Have you used DIKSHA or SWAYAM?</label>

           <select name="diksha_swayam" required>
             <option>Select an option</option>
             <option>DIKSHA</option>
             <option>SWAYAM</option>
             <option>Both</option>
             <option>Neither</option>
           </select>

            <label>9.What type of digital content do you prefer?</label>

            <select name="content_preference" required>
              <option>Select an option</option>
              <option>Video lectures</option>
              <option>Notes / PDFs</option>
              <option>Interactive quizzes</option>
              <option>Animations</option>
            </select>

            <label>10.What is the biggest challenge you face in e-learning?</label>

            <select name="e_learning_challenge" required>
              <option>Select an option</option>
              <option>Poor internet connection</option>
              <option>Lack of devices</option>
              <option>Lack of digital skills</option>
              <option>Limited digital content</option>
              <option>Other</option>
            </select>

            <label>11.How comfortable are your teachers with technology?</label>

            <select name="teacher_technology" required>
             <option>Select an option</option>
             <option>Very comfortable</option>
             <option>Comfortable</option>
             <option>Somewhat comfortable</option>
             <option>Not comfortable</option>
            </select>

            <label>12.Is digital learning material available for your syllabus?</label>

            <select name="digital_material" required>
              <option>Select an option</option>
              <option>Yes</option>
              <option>No</option>
              <option>Partially</option>
              <option>Not sure</option>
            </select>

           <label>13.Which subject needs digital learning content the most?</label>

           <select name="subject_need" required>
             <option>Select a subject</option>
             <option>Mathematics</option>
             <option>Science</option>
             <option>English</option>
             <option>Social Science</option>
             <option>Other</option>
           </select>

           <label>14.Which language do you prefer for digital learning?</label>

           <select name="language_preference" required>
             <option>Select a language</option>
             <option>English</option>
             <option>Hindi</option>
             <option>Marathi</option>
             <option>Other</option>
           </select>

            <label>15.What would be the ideal duration of an educational video?</label>

            <select name="video_duration" required>
              <option>Select duration</option>
              <option>Less than 5 minutes</option>
              <option>5–10 minutes</option>
              <option>10–20 minutes</option>
              <option>More than 20 minutes</option>
            </select>

            <label>16.Overall, how useful do you think e-learning is?</label>

            <select name="overall_usefulness" required>
              <option>Select an option</option>
              <option>Very useful</option>
              <option>Useful</option>
              <option>Somewhat useful</option>
              <option>Not useful</option>
            </select>

            <button type="submit">Submit Survey</button>

        </form>

    </section>

</body>

</html>
